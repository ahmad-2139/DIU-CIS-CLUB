<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMAD 024</title>
</head>
<body>
    <h1>Basic HTML Form</h1>
    <form>
        <fieldset>
            <legend>Name</legend>
            <div>
            <label for="firstname">First name:</label><br/>
            <input type="text" name="firstname" id="firstname"><br/>
            </div>
            <div>
            <label for="lastname">Last name:</label><br/>
            <input type="text" name="lastname" id="lastname">
            </div>
    </fieldset>

        <fieldset>
            <legend>Other Question</legend>
            <label for="drink">Choose a drink:</label><br/>
            <input type="radio" name="drink" id="drink" value="coffee">Coffee<br/>
            <input type="radio" name="drink" id="drink" value="tea">Tea<br/>
            <input type="radio" name="drink" id="drink" value="hot chocolate">hot chocolate<br/>

            <label for="icecream">What ice cream do you like?</label><br/>
            <input type="checkbox" name="icecream" id="icecream" value="chocolate">chocolate<br/>
            <input type="checkbox" name="icecream" id="icecream" value="chocolate pudding">chocolate pudding<br/>
            <input type="checkbox" name="icecream" id="icecream" value="chocolate peanut butter">chocolate peanut butter<br/>
            <input type="checkbox" name="icecream" id="icecream" value="vanilla">vanilla<br/>
            <input type="checkbox" name="icecream" id="icecream" value="strawberry">strawberry<br/>
<div>
            <label for="school">Select a School:</label><br/>
            <select name="school">
                <option value="harvard" selected>Harvard</option>
                <option value="starford">stanford</option>
                <option value="oxford">Oxford</option>
   
            </select></div>
            <label for="messege"> Please provide comments:</label><br/>
            <textarea cols="20" rows="10"> </textarea><br/>
        </fieldset>
        <input type="submit" value="submit">
    </form>
</body>
</html>

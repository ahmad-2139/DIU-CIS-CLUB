<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form </title>
</head>
<body>
    <form> 

        <label for="name"> Enter Your name:</label><br/>
        <input type="text" name="name" id="name"> <br/>

        <label for="email"> Enter Your Email:</label><br/>
        <input type="email" name="email" id="email"><br/>

        <label for="password"> password:</label><br/>
        <input type="password" name="password" id="password"><br/>

        <label for="dob"> Enter Your Date of Birth:</label><br/>
        <input type="date" name="dob" id="dob"><br/>

        <label for="Photo"> Enter Your Photo:</label>
        <input type="file" name="photo" id="photo"><br/>

        <label for="Gender"> Enter Your Gender:</label>
        <input type="radio" name="gender" id="gender" value="male">Male
        <input type="radio" name="gender" id="gender" value="female">FeMale<br/>
        
        <label for="Religion"> Enter Your Religion:</label><br/>
        <input type="checkbox" name="religion" id="religion" value="islam">Islam
        <input type="checkbox" name="religion" id="religion" value="hindu">Hindu
        <input type="checkbox" name="religion" id="religion" value="Cristian">Cristian<br/>

        <label for="Subject"> Enter Your Religion:</label><br/>
        <select name="Subject">
            <option value="science">Science</option>
            <option value="arts">Arts</option>
            <option value="commerce">commerce</option>
        </select><br/>

        <label for="message"> Enter Your Feedback:</label><br/>
        <textarea col="30" row="10">  </textarea><br/>
        <div>
            
        </div>

        <input type="submit" value="Submit">




    </form>
</body>
</html>
